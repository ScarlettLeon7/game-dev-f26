name: Minigame boundaries
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  boundaries:
    name: Minigame submission boundaries
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","course-lxd"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@v4
        with:
          # github.sha is the base branch tip when this run starts. The event's
          # base.sha can predate it (a reopened PR kept a base from before
          # newer rules merged), which would run an older copy of these rules.
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out submitted files for static inspection only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: submitted
          fetch-depth: 0
          persist-credentials: false
          # Fork code is read as data; only code from trusted/ runs below.
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check changed paths and inert metadata using trusted code
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python trusted/scripts/minigames.py --root submitted boundary
          --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
      # Never run, import, install, or source anything from submitted/ here.
