name: Setup and deterministic checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Explicitly authorize one live request using the selected provider
        type: boolean
        default: false
      provider:
        description: Live model provider (choose only one)
        type: choice
        options: [vertex, anthropic, openai]
        default: vertex

permissions:
  contents: read

# A newer push to the same PR cancels the older run; other runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic:
    name: Deterministic checks (Python ${{ matrix.python }})
    # Repository variable CI_RUNNER=self-hosted moves this job to the
    # instructor's sandboxed runner on the host conductor1, which only that
    # machine's runners are labeled with; unset, it runs on GitHub's runner.
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","course-lxd","conductor1"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus its parents, so HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      # A PR that changes only student folders leaves the starter untouched,
      # so both required checks report success without retesting it. Any
      # other path, or a diff that cannot be computed, runs everything.
      - name: Decide whether this change touches the starter
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          starter=true
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only HEAD^1 HEAD) && [ -n "$changed" ]; then
            if ! printf '%s\n' "$changed" | grep -qvE '^(midterms/|minigames/submissions/|\.github/workflows/midterm-[^/]+\.yml$)'; then
              starter=false
              echo "Only student folders changed; the starter checks are skipped."
            fi
          fi
          echo "starter=$starter" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.scope.outputs.starter == 'true'
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - if: steps.scope.outputs.starter == 'true'
        run: uv sync --frozen
      - if: steps.scope.outputs.starter == 'true'
        run: uv run --frozen python -m unittest discover -s tests -v
      - if: steps.scope.outputs.starter == 'true'
        run: uv run --frozen python -m course_game.setup_check --offline --headless

  live-model:
    name: Live Setup Verification (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
      COURSE_MODEL: ${{ vars.COURSE_MODEL }}
      COURSE_PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - uses: google-github-actions/auth@v2
        if: inputs.provider == 'vertex'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.COURSE_SERVICE_ACCOUNT }}
      - name: Live Vertex AI check
        if: inputs.provider == 'vertex'
        run: uv run --frozen python -m course_game.setup_check --provider "$COURSE_PROVIDER" --headless
      - name: Live Anthropic check
        if: inputs.provider == 'anthropic'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --frozen python -m course_game.setup_check --provider "$COURSE_PROVIDER" --headless
      - name: Live OpenAI check
        if: inputs.provider == 'openai'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen python -m course_game.setup_check --provider "$COURSE_PROVIDER" --headless
